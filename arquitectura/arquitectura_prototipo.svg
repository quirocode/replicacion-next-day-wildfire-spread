<text x="318" y="900" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">hecho por los autores (se reutiliza)</text>
<rect x="620" y="888" width="20" height="14" rx="3" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.4"/>
<text x="648" y="900" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">datos</text>
